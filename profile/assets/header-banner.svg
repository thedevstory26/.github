<svg viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#F76C6C"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Fira+Code:wght@400;600&amp;display=swap');

    .card-bg {
      fill: url(#bgGrad);
      stroke: rgba(155, 89, 182, 0.25);
      stroke-width: 1.5;
      rx: 16px;
    }

    .brand-the {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 42px;
      font-weight: 400;
      fill: #e2e8f0;
      letter-spacing: -1px;
    }

    .brand-dev {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: url(#purpleGrad);
      letter-spacing: -1px;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4));
    }

    .brand-story {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 42px;
      font-weight: 400;
      fill: #e2e8f0;
      letter-spacing: -1px;
    }

    .entry-tagline {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #a78bfa;
      letter-spacing: 1.5px;
      opacity: 0;
      animation: fadeInTagline 2.5s ease-out 0.8s forwards;
    }

    .subtitle-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      fill: #94a3b8;
    }

    .arc-line {
      stroke: #9B59B6;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawArc 3.5s ease-in-out infinite alternate;
    }

    .floating-sym {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      fill: rgba(168, 85, 247, 0.35);
      animation: floatSym 6s ease-in-out infinite alternate;
    }

    .sym-1 { font-size: 18px; animation-delay: 0s; }
    .sym-2 { font-size: 16px; animation-delay: 1.5s; fill: rgba(6, 182, 212, 0.35); }
    .sym-3 { font-size: 20px; animation-delay: 3s; fill: rgba(236, 72, 153, 0.35); }
    .sym-4 { font-size: 15px; animation-delay: 0.8s; }

    .logo-speed-line {
      stroke: #ffffff;
      stroke-linecap: round;
    }

    .star-dot {
      fill: #a78bfa;
      animation: pulseStar 3s ease-in-out infinite alternate;
    }

    @keyframes fadeInTagline {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 0.95; transform: translateY(0); }
    }

    @keyframes drawArc {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatSym {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(6deg); }
    }

    @keyframes pulseStar {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }
  </style>

  <!-- Card Background -->
  <rect x="8" y="8" width="834" height="244" class="card-bg"/>

  <!-- Background Ambient Glow Orbs -->
  <circle cx="160" cy="130" r="90" fill="#9B59B6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="700" cy="100" r="100" fill="#06b6d4" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Starry Accents -->
  <circle cx="90" cy="45" r="1.5" class="star-dot" style="animation-delay: 0s;"/>
  <circle cx="780" cy="60" r="2" class="star-dot" style="animation-delay: 1s;"/>
  <circle cx="720" cy="200" r="1.2" class="star-dot" style="animation-delay: 2s;"/>
  <circle cx="140" cy="210" r="1.8" class="star-dot" style="animation-delay: 0.5s;"/>

  <!-- Floating Peripheral Tech Symbols -->
  <text x="65" y="80" class="floating-sym sym-1">{ }</text>
  <text x="760" y="95" class="floating-sym sym-2">&lt;/&gt;</text>
  <text x="780" y="195" class="floating-sym sym-3">=&gt;</text>
  <text x="80" y="190" class="floating-sym sym-4">fn()</text>

  <!-- Center Logo & Wordmark Group -->
  <g transform="translate(195, 42)">
    <!-- Logo SVG Icon -->
    <g transform="translate(0, 0) scale(0.45)">
      <path class="logo-speed-line" d="M50 60 H120 Q160 60 160 100 Q160 140 120 140 H50" stroke-width="7" fill="none"/>
      <path class="logo-speed-line" d="M30 80 H100" stroke-width="5" fill="none"/>
      <path class="logo-speed-line" d="M35 100 H80" stroke-width="5" fill="none"/>
      <path class="logo-speed-line" d="M30 120 H100" stroke-width="5" fill="none"/>
      <circle cx="145" cy="145" r="12" fill="#9B59B6" filter="url(#glow)"/>
    </g>

    <!-- Company Name Wordmark: the dev story -->
    <text x="100" y="62">
      <tspan class="brand-the">the</tspan><tspan class="brand-dev">dev</tspan><tspan class="brand-story">story</tspan>
    </text>

    <!-- Underline Arc SVG below "dev" -->
    <path class="arc-line" d="M175 74 Q220 62 265 71" fill="none"/>

    <!-- Site Entry Animation Tagline (directly below company name) -->
    <text x="102" y="105" class="entry-tagline">// we build things that matter</text>

    <!-- Company Subtitle -->
    <text x="102" y="135" class="subtitle-text">A small studio building lightweight tools respecting your time, data, and privacy.</text>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="8" y="248" width="834" height="4" fill="url(#purpleGrad)" rx="2" opacity="0.85"/>
</svg>
