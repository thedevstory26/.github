<svg viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="btnGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
    .btn-body-dark {
      fill: url(#btnGradDark);
      rx: 12px;
      transition: all 0.3s ease;
    }
    .btn-text-dark {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .btn-icon-dark {
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- Button Background -->
  <rect x="4" y="4" width="272" height="48" class="btn-body-dark" filter="url(#btnGlowDark)"/>

  <!-- Button Content -->
  <g transform="translate(45, 14)">
    <text x="0" y="21" class="btn-text-dark">Launch Splito App</text>
    <g transform="translate(155, 6)">
      <path class="btn-icon-dark" d="M5 12h14M12 5l7 7-7 7" transform="scale(0.8)"/>
    </g>
  </g>
</svg>
