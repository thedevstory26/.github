<svg viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="purpleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <filter id="softGlowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Fira+Code:wght@400;600&amp;display=swap');

    .card-bg-light {
      fill: url(#bgGradLight);
      stroke: #cbd5e1;
      stroke-width: 1.5;
      rx: 16px;
    }

    .brand-the-light {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 42px;
      font-weight: 400;
      fill: #0f172a;
      letter-spacing: -1px;
    }

    .brand-dev-light {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: url(#purpleGradLight);
      letter-spacing: -1px;
    }

    .brand-story-light {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 42px;
      font-weight: 400;
      fill: #0f172a;
      letter-spacing: -1px;
    }

    .entry-tagline-light {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #6b21a8;
      letter-spacing: 1.5px;
      opacity: 0;
      animation: fadeInTagline 2.5s ease-out 0.8s forwards;
    }

    .subtitle-text-light {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #475569;
    }

    .arc-line-light {
      stroke: #9333ea;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawArc 3.5s ease-in-out infinite alternate;
    }

    .floating-sym-light {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      fill: rgba(147, 51, 234, 0.25);
      animation: floatSym 6s ease-in-out infinite alternate;
    }

    .sym-1 { font-size: 18px; animation-delay: 0s; }
    .sym-2 { font-size: 16px; animation-delay: 1.5s; fill: rgba(8, 145, 178, 0.25); }
    .sym-3 { font-size: 20px; animation-delay: 3s; fill: rgba(219, 39, 119, 0.25); }
    .sym-4 { font-size: 15px; animation-delay: 0.8s; }

    .logo-speed-line-light {
      stroke: #0f172a;
      stroke-linecap: round;
    }

    .star-dot-light {
      fill: #a855f7;
      animation: pulseStar 3s ease-in-out infinite alternate;
    }

    @keyframes fadeInTagline {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 0.95; transform: translateY(0); }
    }

    @keyframes drawArc {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatSym {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(6deg); }
    }

    @keyframes pulseStar {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }
  </style>

  <!-- Card Background -->
  <rect x="8" y="8" width="834" height="244" class="card-bg-light"/>

  <!-- Background Soft Color Blobs -->
  <circle cx="160" cy="130" r="90" fill="#f3e8ff" opacity="0.6" filter="url(#softGlowLight)"/>
  <circle cx="700" cy="100" r="100" fill="#e0f2fe" opacity="0.6" filter="url(#softGlowLight)"/>

  <!-- Starry Accents -->
  <circle cx="90" cy="45" r="1.5" class="star-dot-light" style="animation-delay: 0s;"/>
  <circle cx="780" cy="60" r="2" class="star-dot-light" style="animation-delay: 1s;"/>
  <circle cx="720" cy="200" r="1.2" class="star-dot-light" style="animation-delay: 2s;"/>
  <circle cx="140" cy="210" r="1.8" class="star-dot-light" style="animation-delay: 0.5s;"/>

  <!-- Floating Peripheral Tech Symbols -->
  <text x="65" y="80" class="floating-sym-light sym-1">{ }</text>
  <text x="760" y="95" class="floating-sym-light sym-2">&lt;/&gt;</text>
  <text x="780" y="195" class="floating-sym-light sym-3">=&gt;</text>
  <text x="80" y="190" class="floating-sym-light sym-4">fn()</text>

  <!-- Center Logo & Wordmark Group -->
  <g transform="translate(195, 42)">
    <!-- Logo SVG Icon -->
    <g transform="translate(0, 0) scale(0.45)">
      <path class="logo-speed-line-light" d="M50 60 H120 Q160 60 160 100 Q160 140 120 140 H50" stroke-width="7" fill="none"/>
      <path class="logo-speed-line-light" d="M30 80 H100" stroke-width="5" fill="none"/>
      <path class="logo-speed-line-light" d="M35 100 H80" stroke-width="5" fill="none"/>
      <path class="logo-speed-line-light" d="M30 120 H100" stroke-width="5" fill="none"/>
      <circle cx="145" cy="145" r="12" fill="#9B59B6"/>
    </g>

    <!-- Company Name Wordmark: the dev story -->
    <text x="100" y="62">
      <tspan class="brand-the-light">the</tspan><tspan class="brand-dev-light">dev</tspan><tspan class="brand-story-light">story</tspan>
    </text>

    <!-- Underline Arc SVG below "dev" -->
    <path class="arc-line-light" d="M175 74 Q220 62 265 71" fill="none"/>

    <!-- Site Entry Animation Tagline (directly below company name) -->
    <text x="102" y="105" class="entry-tagline-light">// we build things that matter</text>

    <!-- Company Subtitle -->
    <text x="102" y="135" class="subtitle-text-light">A small studio building lightweight tools respecting your time, data, and privacy.</text>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="8" y="248" width="834" height="4" fill="url(#purpleGradLight)" rx="2" opacity="0.85"/>
</svg>
